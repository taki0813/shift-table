<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シフト表</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <label class="date-field">
          <span class="visually-hidden">日付</span>
          <input type="date" id="date" />
          <span id="date-label" class="date-label" aria-hidden="true"></span>
        </label>
      </div>
    </header>

    <div class="layout">
      <aside class="panel" aria-labelledby="input-title">
        <div class="panel-head">
          <h2 id="input-title">スタッフ <span id="staff-count" class="count"></span></h2>
          <div class="panel-tools">
            <button type="button" id="sample" class="link">サンプル</button>
            <button type="button" id="clear" class="link">クリア</button>
          </div>
        </div>

        <div class="staff-head" aria-hidden="true">
          <span>名前</span><span>出勤</span><span>退勤</span><span class="r">時間</span><span class="c">休憩</span><span></span>
        </div>
        <div id="staff-list"></div>
        <button type="button" id="add" class="add-row">＋ スタッフを追加</button>

        <div class="panel-foot">
          <p id="input-error" class="input-error" role="alert"></p>
          <button type="button" id="make" class="btn btn-primary btn-block">シフトを作る</button>
          <p class="hint">入力内容はこの端末のブラウザにだけ保存されます。</p>
        </div>
      </aside>

      <main class="content">
        <div id="empty" class="empty">
          <p>スタッフの勤務時間を入力して「シフトを作る」を押してください。</p>
          <p class="sub">レジ1名・お点前2名・ミルク1名・残りはサポート。8時〜18時を1時間ごとに、全員が均等に回るよう割り当てます。</p>
        </div>

        <section id="result" hidden>
          <div class="content-head">
            <h1 id="result-title">シフト表</h1>
            <div class="toolbar">
              <button type="button" id="remake" class="btn">別の案を出す</button>
              <button type="button" id="print" class="btn">印刷</button>
            </div>
          </div>

          <ul id="warnings" class="warnings"></ul>

          <div class="table-wrap"><table id="shift" class="grid shift-table"></table></div>

          <ul class="legend">
            <li><i class="sw role-register"></i>レジ</li>
            <li><i class="sw role-temae"></i>お点前</li>
            <li><i class="sw role-milk"></i>ミルク</li>
            <li><i class="sw role-support"></i>サポート</li>
            <li><i class="sw role-break"></i>休憩</li>
          </ul>

          <h2 class="section-title">役職の回数</h2>
          <p class="hint">実績 / 期待回数。期待回数は、勤務時間とその時間帯の人数から計算した公平な回数です。</p>
          <div class="table-wrap"><table id="counts" class="grid counts-table"></table></div>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
